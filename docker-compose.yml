services:
  app:
    image: ghcr.io/augustindaillere/crazydev:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      # Accessible uniquement depuis le VPS : c'est Nginx qui l'expose sur Internet
      - "127.0.0.1:8080:80"
    volumes:
      - app-data:/var/www/html/config/data   # base SQLite (persiste entre les déploiements)
      - app-logs:/var/www/html/log

volumes:
  app-data:
  app-logs:
