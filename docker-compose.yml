services:
  app:
    image: crazydev:${APP_ENV:-prod}
    build: .
    restart: unless-stopped
    ports:
      # Accessible uniquement depuis le VPS : c'est Nginx qui l'expose sur Internet
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - app-data:/var/www/html/config/data   # base SQLite (une par environnement)
      - app-logs:/var/www/html/log

volumes:
  app-data:
  app-logs: