services:
  app:
    image: ghcr.io/augustindaillere/crazydev:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    volumes:
      - app-data:/var/www/html/config/data   # base SQLite (persiste entre les déploiements)
      - app-logs:/var/www/html/log
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-192-162-69-165.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificats Let's Encrypt
      - caddy-config:/config
    networks: [web]

networks:
  web:

volumes:
  app-data:
  app-logs:
  caddy-data:
  caddy-config:
