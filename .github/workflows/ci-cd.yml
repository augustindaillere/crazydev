name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PROD_URL: http://192.162.69.165

jobs:
  # ---------- CI : qualité du code ----------
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Vérification de la syntaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  # ---------- CI : build + tests de l'image ----------
  build-test:
    name: Build et tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image Docker
        run: docker build -t crazydev:test .
      - name: Démarrage du conteneur
        run: |
          docker run -d --name crazydev -p 8080:80 crazydev:test
          for i in $(seq 1 20); do curl -fs -o /dev/null http://localhost:8080/ && break; sleep 1; done
      - name: Tests de fumée
        run: bash scripts/smoke-test.sh http://localhost:8080
      - name: Logs du conteneur en cas d'échec
        if: failure()
        run: docker logs crazydev

  # ---------- CD : publication + déploiement (uniquement sur main) ----------
  deploy:
    name: Déploiement en production
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: ${{ env.PROD_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Configuration de la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Déploiement sur le VPS
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Les variables passent par l'entrée standard (jamais visibles dans la liste des processus du VPS)
          {
            printf 'export IMAGE_TAG=%q GHCR_USER=%q GHCR_TOKEN=%q\n' "$IMAGE_TAG" "$GHCR_USER" "$GHCR_TOKEN"
            cat scripts/deploy.sh
          } | ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s'

      - name: Vérification de la production
        run: |
          for i in $(seq 1 12); do curl -fs -o /dev/null "$PROD_URL/" && break; sleep 5; done
          bash scripts/smoke-test.sh "$PROD_URL"
