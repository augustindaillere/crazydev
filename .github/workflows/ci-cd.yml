name: Déploiement continu

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : un nouveau push attend la fin du précédent
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROD_URL: http://192.162.69.165

jobs:
  deploy:
    name: Déploiement en production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PROD_URL }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de la clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déploiement sur le VPS
        run: ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' < scripts/deploy.sh

      - name: Vérification que le site répond
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null "$PROD_URL/"; then echo "Site en ligne : $PROD_URL"; exit 0; fi
            sleep 5
          done
          echo "Le site ne répond pas après le déploiement"
          exit 1