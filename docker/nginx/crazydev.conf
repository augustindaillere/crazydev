# Site CrazyDev — reverse proxy Nginx (installé sur le VPS)
# Copié dans /etc/nginx/sites-available/crazydev
# Le HTTPS (bloc "listen 443 ssl" + redirection) est ajouté automatiquement par Certbot.

server {
    listen 80;
    listen [::]:80;
    server_name augustin-daillere.angers.mds-project.fr;

    # Les photos webcam sont envoyées en base64 : on accepte jusqu'à 48 Mo (1 Mo par défaut)
    client_max_body_size 48M;

    # Ne pas afficher la version de Nginx
    server_tokens off;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Compression des fichiers texte
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Logs dédiés au site
    access_log /var/log/nginx/crazydev.access.log;
    error_log  /var/log/nginx/crazydev.error.log;

    location / {
        # Conteneur Docker de l'application (publié uniquement sur 127.0.0.1)
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
