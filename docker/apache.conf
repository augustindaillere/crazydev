ServerName localhost
ServerTokens Prod
ServerSignature Off

# Autorise le .htaccess du projet (blocage de config/, includes/, *.sqlite, etc.)
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Nginx est le seul point d'entrée : on récupère l'IP réelle du visiteur
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.16.0.0/12
