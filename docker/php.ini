; Réglages PHP propres à CrazyDev
date.timezone = Europe/Paris
expose_php = Off

; Les photos de la webcam sont envoyées en base64 dans du JSON (jusqu'à 8 Mo chacune)
post_max_size = 48M
upload_max_filesize = 16M
memory_limit = 256M

; Cookies de session protégés (le site est servi en HTTPS par Nginx)
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
